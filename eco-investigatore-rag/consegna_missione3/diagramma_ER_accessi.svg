<svg id="tela" role="img" aria-label="Diagramma del database" viewBox="-118.19999694824219 229 1395.199951171875 302" xmlns="http://www.w3.org/2000/svg" width="1395" height="302"><style>:root{--oro:#c9a35c;--travertino:#ebe1cf;--pietra:#b0a493;--pietra-scura:#7a6e60;--tevere:#7aa7b8;--tevere-chiaro:#cfeaf2;--bordo-forte:#584a3f;--f-romano:Georgia,serif;--f-testo:Arial,sans-serif;--mono:Consolas,monospace}
.entita rect { fill: rgb(35, 29, 26); stroke: var(--oro); stroke-width: 2; }
.entita.storica rect { stroke: rgb(154, 139, 120); stroke-dasharray: 7, 5; fill: rgb(27, 23, 21); }
.entita text { fill: var(--travertino); font: 700 14px var(--f-romano); letter-spacing: 0.1em; }
.entita .sotto { fill: var(--pietra); font: 600 11px var(--f-testo); letter-spacing: 0px; }
.relazione polygon { fill: rgb(20, 35, 42); stroke: var(--tevere); stroke-width: 2; }
.relazione text { fill: var(--tevere-chiaro); font: 700 11px var(--f-testo); letter-spacing: 0.03em; }
.attributo ellipse { fill: rgb(26, 22, 20); stroke: rgb(122, 110, 96); stroke-width: 1.4; }
.attributo text { fill: var(--travertino); font: 600 11.5px var(--f-testo); }
.attributo .sig { fill: var(--pietra-scura); font: 600 9.5px var(--f-testo); }
.attributo.pk ellipse { stroke: var(--oro); }
.attributo.pk text:first-of-type { text-decoration: underline; font-weight: 800; }
.nodo { cursor: pointer; }
.nodo:hover rect, .nodo:hover polygon, .nodo:hover ellipse { filter: drop-shadow(rgba(201, 163, 92, 0.6) 0px 0px 6px); }
.nodo.scelto rect, .nodo.scelto polygon, .nodo.scelto ellipse { stroke: rgb(255, 241, 196); stroke-width: 3; }
.nodo.usato rect, .nodo.usato polygon, .nodo.usato ellipse, .tabella.usato .testa { stroke: rgb(255, 226, 170); filter: drop-shadow(rgba(255, 176, 0, 0.75) 0px 0px 8px); }
.spento { opacity: 0.28; }
.linea { stroke: rgb(107, 94, 79); stroke-width: 1.5; fill: none; }
.linea.rel { stroke: var(--tevere); stroke-width: 2.2; }
.linea.storica { stroke-dasharray: 6, 5; opacity: 0.8; }
.linea.usata { stroke: rgb(255, 226, 170); stroke-width: 2.6; stroke-dasharray: 8, 6; animation: 1s linear 0s infinite normal none running scorre; }
.linea.sopra { stroke: rgb(255, 241, 196); stroke-width: 2.8; }
.card { fill: var(--oro); font: 700 12px var(--f-testo); paint-order: stroke; stroke: rgb(13, 11, 10); stroke-width: 4px; stroke-linejoin: round; }
.tabella .corpo { fill: rgb(25, 21, 19); stroke: var(--bordo-forte); stroke-width: 1.5; }
.tabella .testa { fill: rgb(42, 33, 18); stroke: var(--oro); stroke-width: 1.5; }
.tabella.storica .testa { stroke: rgb(154, 139, 120); stroke-dasharray: 6, 4; }
.tabella .nome-t { fill: var(--oro); font: 700 13.5px var(--f-romano); letter-spacing: 0.1em; }
.tabella .conta { fill: var(--pietra); font: 600 11px var(--f-testo); }
.tabella .col { fill: var(--travertino); font: 600 12.5px var(--mono); }
.tabella .tipo { fill: var(--pietra-scura); font: 600 10.5px var(--mono); }
.tabella .chiave { font: 700 10px var(--f-testo); }
.tabella .chiave.pk { fill: var(--oro); }
.tabella .chiave.fk { fill: var(--tevere); }
.tabella .riga-col { fill: transparent; }
.tabella .riga-col.usata { fill: rgba(255, 226, 170, 0.14); }
.tabella .col.usata { fill: rgb(255, 226, 170); }
.zampa { stroke: var(--tevere); stroke-width: 2; fill: none; }
.zampa.usata { stroke: rgb(255, 226, 170); }
.linea.usata{animation:none}</style><rect x="-118.19999694824219" y="229" width="1395.199951171875" height="302" fill="#12100e"/><g><line x1="190" y1="380" x2="55.55920023261939" y2="432.0657963846097" class="linea" data-col="operatori.id"/><line x1="190" y1="380" x2="-15.099999999999994" y2="380" class="linea" data-col="operatori.nome"/><line x1="1010" y1="380" x2="1185.5" y2="380" class="linea" data-col="depositi.id"/><line x1="1010" y1="380" x2="1162.6726575136124" y2="443.63597335896736" class="linea" data-col="depositi.nome"/><line x1="1010" y1="380" x2="1155.5484441926058" y2="327.9342036153903" class="linea" data-col="depositi.settore"/><line x1="600" y1="380" x2="712.8092254999876" y2="442.0495998926372" class="linea" data-col="accessi.id"/><line x1="600" y1="380" x2="600" y2="479" class="linea" data-col="accessi.pratica"/><line x1="600" y1="380" x2="483.4626063638304" y2="442.0495998926372" class="linea" data-col="accessi.codice"/><line x1="600" y1="380" x2="600" y2="281" class="linea" data-col="accessi.stato"/><line x1="600" y1="380" x2="723.9937299085334" y2="317.9504001073628" class="linea" data-col="accessi.valido_fino"/><line x1="190" y1="380" x2="395" y2="380" class="linea rel" data-rel="accessi.operatore_id&gt;operatori.id"/><line x1="395" y1="380" x2="600" y2="380" class="linea rel" data-rel="accessi.operatore_id&gt;operatori.id"/><line x1="1010" y1="380" x2="805" y2="380" class="linea rel" data-rel="accessi.deposito_id&gt;depositi.id"/><line x1="805" y1="380" x2="600" y2="380" class="linea rel" data-rel="accessi.deposito_id&gt;depositi.id"/></g><g><text x="312" y="371" text-anchor="middle" class="card">(0,N)</text><text x="478" y="397" text-anchor="middle" class="card">(1,1)</text><text x="888" y="397" text-anchor="middle" class="card">(1,N)</text><text x="722" y="371" text-anchor="middle" class="card">(1,1)</text></g><g><g class="attributo pk nodo" data-col="operatori.id" data-k="a:operatori.id" tabindex="0" role="button"><ellipse cx="55.559200232