k="a:accessi.id" tabindex="0" role="button"><ellipse cx="712.8092254999876" cy="442.0495998926372" rx="61.5" ry="22"/><text x="712.8092254999876" y="442.0495998926372" text-anchor="middle">id</text><text x="712.8092254999876" y="454.0495998926372" text-anchor="middle" class="sig">chiave primaria</text><title>accessi.id · INTEGER · chiave primaria · chiave primaria</title></g><g class="attributo nodo" data-col="accessi.pratica" data-k="a:accessi.pratica" tabindex="0" role="button"><ellipse cx="600" cy="479" rx="81.8" ry="22"/><text x="600" y="479" text-anchor="middle">pratica</text><text x="600" y="491" text-anchor="middle" class="sig">pratica che autorizza </text><title>accessi.pratica · TEXT · pratica che autorizza il permesso</title></g><g class="attributo nodo" data-col="accessi.codice" data-k="a:accessi.codice" tabindex="0" role="button"><ellipse cx="483.4626063638304" cy="442.0495998926372" rx="67.3" ry="22"/><text x="483.4626063638304" y="442.0495998926372" text-anchor="middle">codice</text><text x="483.4626063638304" y="454.0495998926372" text-anchor="middle" class="sig">codice di accesso</text><title>accessi.codice · TEXT · codice di accesso (TESTO: può iniziare con zero)</title></g><g class="attributo nodo" data-col="accessi.stato" data-k="a:accessi.stato" tabindex="0" role="button"><ellipse cx="600" cy="281" rx="81.8" ry="22"/><text x="600" y="281" text-anchor="middle">stato</text><text x="600" y="293" text-anchor="middle" class="sig">attivo oppure revocato</text><title>accessi.stato · TEXT · attivo oppure revocato</title></g><g class="attributo nodo" data-col="accessi.valido_fino" data-k="a:accessi.valido_fino" tabindex="0" role="button"><ellipse cx="723.9937299085334" cy="317.9504001073628" rx="78.9" ry="22"/><text x="723.9937299085334" y="317.9504001073628" text-anchor="middle">valido_fino</text><text x="723.9937299085334" y="329.9504001073628" text-anchor="middle" class="sig">scadenza del permesso</text><title>accessi.valido_fino · TEXT · scadenza del 